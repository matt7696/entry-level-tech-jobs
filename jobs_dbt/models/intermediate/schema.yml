version: 2

models:
  - name: int_postings_classified
    description: "Postings from staging with role family, level, and active flag."
    columns:
      - name: posting_key
        data_tests:
          - unique
          - not_null
      - name: role_family
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['data engineering', 'data analytics', 'data science / ML', 'software / other engineering', 'other']
      - name: level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['internship', 'new grad / early career', 'junior', 'senior+', 'unlabeled']
      - name: years_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['not stated', '0-2 years', '3-4 years', '5+ years']

  - name: int_postings_deduped
    description: "Classified postings with a primary-posting flag for one row per role (company + normalized title)."
    columns:
      - name: posting_key
        data_tests:
          - unique
          - not_null
      - name: is_primary_posting
        data_tests:
          - not_null